    baseline_admin_ssh_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMoleculeTestKeyOnlyNotARealKeyxxxxxxxxxxxx molecule@test"
  roles:
    - role: baseline
