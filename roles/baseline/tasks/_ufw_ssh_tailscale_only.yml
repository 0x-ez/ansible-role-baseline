---
# Shared by firewall.yml and tailscale.yml. Expects baseline__ts_up (bool).
# Only touches the public SSH rule once tailscale0 is confirmed up.
- name: Allow SSH on tailscale0
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: "{{ baseline_ssh_port | string }}"
    proto: tcp
    comment: ssh via tailscale
  when:
    - baseline_ssh_tailscale_only | bool
    - baseline__ts_up | bool

- name: Remove public SSH rule
  community.general.ufw:
    rule: allow
    port: "{{ baseline_ssh_port | string }}"
    proto: tcp
    delete: true
  when:
    - baseline_ssh_tailscale_only | bool
    - baseline__ts_up | bool
