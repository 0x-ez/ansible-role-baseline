---
# Internal variables - not meant to be overridden.
baseline__deb_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
  ppc64le: ppc64el
  s390x: s390x
baseline__deb_arch: "{{ baseline__deb_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

# sshd -T prints the legacy alias on some OpenSSH versions.
baseline__permit_root_login_aliases:
  prohibit-password: [prohibit-password, without-password]
  "no": ["no"]
  "yes": ["yes"]
  forced-commands-only: [forced-commands-only]
